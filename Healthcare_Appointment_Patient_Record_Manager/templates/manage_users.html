
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Management | ClinicCare</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Staff Management</h2>
            <p class="text-muted mb-0">
                Create Doctor and Receptionist accounts.
            </p>
        </div>

        <a href="{{ url_for('auth.dashboard') }}"
           class="btn btn-outline-secondary">
            Back to Dashboard
        </a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close"
                        data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endwith %}

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="mb-3">Create Staff Account</h5>

            <form method="POST" action="{{ url_for('auth.manage_users') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        required
                        maxlength="80"
                        autocomplete="off"
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Temporary Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        required
                        minlength="8"
                        autocomplete="new-password"
                    >
                    <div class="form-text">
                        Use a strong password with at least 8 characters.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label">Staff Role</label>
                    <select class="form-select" id="role" name="role" required>
                        <option value="">Select a role</option>
                        <option value="Doctor">Doctor</option>
                        <option value="Receptionist">Receptionist</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Create Account
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
