
{% extends "base.html" %}
{% block title %}Edit Prescription | ClinicCare{% endblock %}

{% block content %}
<div class="card shadow-sm">
  <div class="card-header bg-white">
    <h1 class="h4 mb-0">Edit Prescription</h1>
    <small class="text-secondary">{{ prescription['full_name'] }}</small>
  </div>

  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Medication Name</label>
        <input type="text" name="medication_name" class="form-control"
               maxlength="120" required
               value="{{ form.get('medication_name', prescription['medication_name']) }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Dosage</label>
        <input type="text" name="dosage" class="form-control"
               maxlength="100" required
               value="{{ form.get('dosage', prescription['dosage']) }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Frequency</label>
        <input type="text" name="frequency" class="form-control"
               maxlength="100" required
               value="{{ form.get('frequency', prescription['frequency']) }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Duration</label>
        <input type="text" name="duration" class="form-control"
               maxlength="100" required
               value="{{ form.get('duration', prescription['duration']) }}">
      </div>

      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{{ url_for('medical_records.patient_records', patient_id=prescription['patient_id']) }}"
         class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
