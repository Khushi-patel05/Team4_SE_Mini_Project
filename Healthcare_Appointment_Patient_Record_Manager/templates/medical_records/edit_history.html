
{% extends "base.html" %}
{% block title %}Edit Medical History | ClinicCare{% endblock %}

{% block content %}
<div class="card shadow-sm">
  <div class="card-header bg-white">
    <h1 class="h4 mb-0">Edit Medical History</h1>
    <small class="text-secondary">{{ record['full_name'] }}</small>
  </div>

  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Diagnosis</label>
        <input type="text" name="diagnosis" class="form-control"
               maxlength="200" required
               value="{{ form.get('diagnosis', record['diagnosis']) }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Symptoms</label>
        <textarea name="symptoms" class="form-control"
                  rows="3" maxlength="2000" required>{{ form.get('symptoms', record['symptoms']) }}</textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Clinical Notes</label>
        <textarea name="clinical_notes" class="form-control"
                  rows="4" maxlength="5000" required>{{ form.get('clinical_notes', record['clinical_notes']) }}</textarea>
      </div>

      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{{ url_for('medical_records.patient_records', patient_id=record['patient_id']) }}"
         class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
